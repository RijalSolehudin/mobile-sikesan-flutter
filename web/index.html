<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="description" content="SIKESAN - Sistem Keuangan Santri Pondok Pesantren">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIKESAN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SIKESAN - Sistem Keuangan Santri</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #F2FAF6;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }
    flutter-view {
      position: absolute !important;
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }
  </style>

  <script>
    (function() {
      function resetViewportScroll() {
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
        if (document.body && document.body.scrollTop !== 0) {
          document.body.scrollTop = 0;
        }
        if (document.documentElement && document.documentElement.scrollTop !== 0) {
          document.documentElement.scrollTop = 0;
        }
      }

      // VisualViewport handling for mobile virtual keyboard
      if (window.visualViewport) {
        var lastHeight = window.visualViewport.height;

        window.visualViewport.addEventListener('resize', function() {
          var currentHeight = window.visualViewport.height;
          // When keyboard collapses (viewport height returns or increases)
          if (currentHeight > lastHeight) {
            resetViewportScroll();
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }
            window.dispatchEvent(new Event('resize'));
          }
          lastHeight = currentHeight;
        });

        window.visualViewport.addEventListener('scroll', function() {
          resetViewportScroll();
        });
      }

      // Back navigation / popstate
      window.addEventListener('popstate', function() {
        resetViewportScroll();
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        window.dispatchEvent(new Event('resize'));
      });

      window.addEventListener('scroll', resetViewportScroll, { passive: true });
      window.addEventListener('resize', resetViewportScroll, { passive: true });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
