<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta name="description" content="SIKESAN - Sistem Keuangan Santri Pondok Pesantren">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIKESAN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SIKESAN - Sistem Keuangan Santri</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #E8F8F2;
      -webkit-text-size-adjust: 100%;
      touch-action: pan-x pan-y;
    }
    flutter-view {
      position: absolute !important;
      width: 100% !important;
      height: 100% !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
    }

    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #E8F8F2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s ease-out;
    }

    .splash-card {
      width: 84px;
      height: 84px;
      border-radius: 25px;
      background: #FFFFFF;
      box-shadow: 0 12px 32px rgba(5, 150, 105, 0.12), 0 4px 10px rgba(0, 0, 0, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      animation: slidePopup 0.75s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .splash-card-inner {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-title {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.6px;
      color: #064E3B;
      margin-bottom: 6px;
      animation: slidePopup 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) 0.12s forwards;
      opacity: 0;
    }

    .splash-subtitle {
      font-size: 13.5px;
      font-weight: 500;
      color: #234F40;
      letter-spacing: 0.2px;
      animation: slidePopup 0.9s cubic-bezier(0.25, 1, 0.5, 1) 0.22s forwards;
      opacity: 0;
    }

    @keyframes slidePopup {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.85);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>

  <script>
    (function() {
      function resetViewportScroll() {
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
        if (document.body && document.body.scrollTop !== 0) {
          document.body.scrollTop = 0;
        }
        if (document.documentElement && document.documentElement.scrollTop !== 0) {
          document.documentElement.scrollTop = 0;
        }
      }

      if (window.visualViewport) {
        var lastHeight = window.visualViewport.height;

        window.visualViewport.addEventListener('resize', function() {
          var currentHeight = window.visualViewport.height;
          if (currentHeight > lastHeight) {
            resetViewportScroll();
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
              document.activeElement.blur();
            }
            window.dispatchEvent(new Event('resize'));
          }
          lastHeight = currentHeight;
        });

        window.visualViewport.addEventListener('scroll', function() {
          resetViewportScroll();
        });
      }

      var modalDepth = 0;
      var isPoppingFromFlutter = false;
      var onModalPopHandler = null;
      var onRootBackHandler = null;
      var rootGuardActive = false;

      window.sikesanRegisterPopHandler = function(fn) {
        onModalPopHandler = fn;
      };

      window.sikesanRegisterRootBackHandler = function(fn) {
        onRootBackHandler = fn;
      };

      window.sikesanPushModal = function() {
        // Managed natively by Flutter's Navigator stack to prevent GoRouter popstate reload loops
      };

      window.sikesanPopModal = function() {
        // Managed natively by Flutter's Navigator stack to prevent GoRouter popstate reload loops
      };

      window.sikesanEnableRootGuard = function() {
        if (!rootGuardActive) {
          rootGuardActive = true;
          try {
            window.history.pushState({ sikesanRootGuard: true }, '', window.location.href);
          } catch (e) {}
        }
      };

      window.sikesanDisableRootGuard = function() {
        rootGuardActive = false;
      };

      window.sikesanExitApp = function() {
        rootGuardActive = false;
        try {
          window.history.back();
        } catch (e) {}
      };

      window.addEventListener('popstate', function(event) {
        resetViewportScroll();
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        window.dispatchEvent(new Event('resize'));

        // 1. If Flutter closed the modal from UI (tap barrier/close button), we already called history.back(), so ignore this popstate
        if (isPoppingFromFlutter) {
          isPoppingFromFlutter = false;
          return;
        }

        // 2. If a modal is open and user swiped back (hardware/gesture back in browser)
        if (modalDepth > 0) {
          modalDepth--;
          if (typeof onModalPopHandler === 'function') {
            onModalPopHandler();
          }
          return;
        }

        // 3. If on rootpage and user swiped back
        if (rootGuardActive) {
          if (typeof onRootBackHandler === 'function') {
            onRootBackHandler();
            // Re-arm root guard only if rootGuardActive is still true
            if (rootGuardActive) {
              try {
                window.history.pushState({ sikesanRootGuard: true }, '', window.location.href);
              } catch (e) {}
            }
          }
        }
      });

      window.addEventListener('scroll', resetViewportScroll, { passive: true });
      window.addEventListener('resize', resetViewportScroll, { passive: true });

      // Smooth fade-out when Flutter renders first frame
      window.addEventListener('flutter-first-frame', function() {
        var splash = document.getElementById('loading-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 400);
        }
      });
    })();
  </script>
</head>
<body>
  <!-- Native Web Splash Screen with official SIKESAN logo -->
  <div id="loading-splash">
    <div class="splash-card">
      <img src="icons/logo_icon.png" width="68" height="68" style="object-fit: contain;" alt="SIKESAN Logo">
    </div>
    <div class="splash-title">SIKESAN</div>
    <div class="splash-subtitle">Sistem Keuangan Santri</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
